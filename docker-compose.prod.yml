services:
  caddy:
    image: caddy:2-alpine
    container_name: hlovet-caddy
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-5200918.xyz}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

  mysql:
    image: mysql:8.4
    container_name: hlovet-mysql
    restart: unless-stopped
    command:
      [
        "mysqld",
        "--innodb-buffer-pool-size=128M",
        "--max-connections=40",
        "--performance-schema=OFF",
      ]
    mem_limit: 512m
    cpus: 0.75
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hlovet-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 192m
    cpus: 0.25
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  turn:
    image: coturn/coturn:4.6.3-alpine
    container_name: hlovet-turn
    restart: unless-stopped
    network_mode: host
    mem_limit: 96m
    cpus: 0.20
    pids_limit: 80
    command:
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-tcp-relay
      - --no-multicast-peers
      - --fingerprint
      - --stale-nonce=600
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${TURN_REALM:-turn.5200918.xyz}
      - --server-name=${TURN_REALM:-turn.5200918.xyz}
      - --external-ip=${TURN_EXTERNAL_IP}
      - --listening-ip=${TURN_INTERNAL_IP}
      - --relay-ip=${TURN_INTERNAL_IP}
      - --listening-port=${TURN_PORT:-3478}
      - --min-port=${TURN_UDP_MIN:-49160}
      - --max-port=${TURN_UDP_MAX:-49200}
      - --user-quota=8
      - --total-quota=80
      - --log-file=stdout
      - --simple-log

  api-bootstrap:
    image: ghcr.io/huangke977-star/hlovet-hub-api:main
    container_name: hlovet-api-bootstrap
    restart: "no"
    mem_limit: 384m
    cpus: 0.5
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_CONNECTION_LIMIT: ${MYSQL_CONNECTION_LIMIT:-2}
      MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL: ${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:-true}
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      REDIS_URL: redis://redis:6379
    command: ["sh", "-c", "cd apps/api && ./node_modules/.bin/prisma migrate deploy && node dist/prisma/seed.js"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    image: ghcr.io/huangke977-star/hlovet-hub-api:main
    container_name: hlovet-api
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 384m
    cpus: 0.75
    environment:
      API_PORT: ${API_PORT:-3001}
      WEB_ORIGIN: ${WEB_ORIGIN:-https://5200918.xyz}
      SITE_DOMAIN: ${SITE_DOMAIN:-5200918.xyz}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_CONNECTION_LIMIT: ${MYSQL_CONNECTION_LIMIT:-2}
      MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL: ${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:-true}
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      REFRESH_TOKEN_EXPIRES_IN_DAYS: ${REFRESH_TOKEN_EXPIRES_IN_DAYS:-30}
      MAX_REFRESH_SESSIONS_PER_USER: ${MAX_REFRESH_SESSIONS_PER_USER:-10}
      TURN_HOST: ${TURN_HOST:-turn.5200918.xyz}
      TURN_REALM: ${TURN_REALM:-turn.5200918.xyz}
      TURN_SECRET: ${TURN_SECRET}
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_CREDENTIAL_TTL_SECONDS: ${TURN_CREDENTIAL_TTL_SECONDS:-3600}
      STUN_URLS: ${STUN_URLS:-stun:turn.5200918.xyz:3478}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@5200918.xyz}
      BACKGROUND_UPLOAD_DIR: /app/uploads/backgrounds
      SITE_ASSET_UPLOAD_DIR: /app/uploads/site-assets
      ANDROID_RELEASE_UPLOAD_DIR: /app/uploads/android-releases
      AVATAR_UPLOAD_DIR: /app/uploads/avatars
      ARTICLE_UPLOAD_DIR: /app/uploads/articles
      CHAT_UPLOAD_DIR: /app/uploads/chat
      GROUP_AVATAR_UPLOAD_DIR: /app/uploads/avatars/groups
      CHAT_GROUP_MEMBER_LIMIT: ${CHAT_GROUP_MEMBER_LIMIT:-100}
      BACKUP_DIR: /app/backups
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:-5200918.xyz}
      PASSKEY_RP_NAME: ${PASSKEY_RP_NAME:-HLOVET}
      PASSKEY_ORIGIN: ${PASSKEY_ORIGIN:-https://5200918.xyz}
      PASSKEY_ANDROID_ORIGINS: ${PASSKEY_ANDROID_ORIGINS:-android:apk-key-hash:wvhkW2Pc36YlEb47klqT7axNV3XKZjRh3AumlyLZBkU}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-https://5200918.xyz/api/auth/google/callback}
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    volumes:
      - background_uploads:/app/uploads/backgrounds
      - site_asset_uploads:/app/uploads/site-assets
      - android_release_uploads:/app/uploads/android-releases
      - avatar_uploads:/app/uploads/avatars
      - article_uploads:/app/uploads/articles
      - chat_uploads:/app/uploads/chat
      - ./backups:/app/backups
    depends_on:
      api-bootstrap:
        condition: service_completed_successfully

  web:
    image: ghcr.io/huangke977-star/hlovet-hub-web:main
    container_name: hlovet-web
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.75
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-auto}
      API_INTERNAL_URL: http://api:3001
      ANDROID_APP_PACKAGE_NAME: ${ANDROID_APP_PACKAGE_NAME:-xyz.hlovet.portal.prototype}
      ANDROID_APP_SHA256_CERT_FINGERPRINT: ${ANDROID_APP_SHA256_CERT_FINGERPRINT:-C2:F8:64:5B:63:DC:DF:A6:25:11:BE:3B:92:5A:93:ED:AC:4D:57:75:CA:66:34:61:DC:0B:A6:97:22:D9:06:45}
      ANDROID_OAUTH_REDIRECT_URI: ${ANDROID_OAUTH_REDIRECT_URI:-https://5200918.xyz/native-auth/google}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
  mysql_data:
  redis_data:
  background_uploads:
  site_asset_uploads:
  android_release_uploads:
  avatar_uploads:
  article_uploads:
  chat_uploads:
